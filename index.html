  <style>

<body>
  <div class="page-shell">
    <header class="topbar" aria-label="页面标题">
      <span class="brand-dot" aria-hidden="true"></span>
      <span>半年主线 · 人生剧本测试</span>

    <main id="app">
      <section id="cover" class="screen cover-screen active" aria-labelledby="cover-title">

          <button id="startBtn" class="primary-btn" type="button">翻开我的半年剧本 <span>→</span></button>
        </div>
      </section>

      <section id="quiz" class="screen quiz-screen" aria-labelledby="questionText">
        <div class="quiz-head">
          <button id="backBtn" class="icon-btn" type="button" aria-label="返回上一题">←</button>
          <div class="progress-wrap">
            <div class="progress-label"><span>正在读你的故事</span><span id="progressText">1 / 30</span></div>
            <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
          </div>
        </div>
        <div class="paper-card question-card">
          <div id="questionNo" class="question-no">QUESTION 01</div>
          <h2 id="questionText"></h2>
          <div id="options" class="options" role="radiogroup" aria-labelledby="questionText"></div>
          <button id="nextBtn" class="primary-btn next-btn" type="button" disabled>下一题 <span>→</span></button>
        </div>
        <p class="quiz-foot">慢一点也没关系，诚实比“正确”更重要</p>
      </section>

      <section id="result" class="screen result-screen" aria-live="polite">
        <div class="paper-card result-card">
          <div class="result-topline"><span>你的半年主线</span><span id="resultCode"></span></div>
          <div id="resultIcon" class="result-icon" aria-hidden="true"></div>
          <p class="result-pre">未来半年，你的人生剧本是——</p>
          <h1 id="resultTitle"></h1>
          <div class="soft-divider"><span>✦</span></div>
          <p id="resultBody" class="result-body"></p>
          <div class="advice-box">
            <span>给你的剧本提示</span>
            <p id="resultAdvice"></p>
          </div>
          <blockquote id="resultQuote"></blockquote>
          <button id="restartBtn" class="secondary-btn" type="button">重新测试</button>
          <p class="disclaimer">本测试仅供自我探索与娱乐，不替代专业心理评估</p>
        </div>
      </section>
    </main>
  </div>
  <script>
const dimensions = ["action", "healing", "order", "relation", "explore", "boundary", "expression", "ease"];

const questions = [
  ["如果突然多出一个完整的周末，你最想怎么过？", [
    ["去一个没去过的地方走走", "explore"], ["把房间和待办整理清爽", "order"], ["关掉提醒，好好睡觉发呆", "healing"], ["约喜欢的人吃饭聊天", "relation"]]],
  ["最近遇到新机会时，你更像哪一种反应？", [
    ["先试一步，再边走边调整", "action"], ["先确认它是否符合我真正想要的", "boundary"], ["想听听信任的人的看法", "relation"], ["会被新鲜感点亮，想探索看看", "explore"]]],
  ["当生活有点乱，你最想先找回什么？", [
    ["稳定的作息与节奏", "order"], ["不被催促的安静空间", "healing"], ["一件能迅速推进的小事", "action"], ["说出感受、被认真听见", "expression"]]],
  ["哪句话更接近你此刻的心声？", [
    ["我想把主动权拿回来", "action"], ["我想对自己再温柔一点", "healing"], ["我想把生活过得更有章法", "order"], ["我想看看更大的世界", "explore"]]],
  ["面对一段消耗你的关系，你更希望自己学会？", [
    ["坦然说不，不再勉强", "boundary"], ["把真实感受讲清楚", "expression"], ["看见彼此需要，慢慢修复", "relation"], ["不反复责怪自己，轻轻放下", "ease"]]],
  ["如果半年后收到一封感谢信，你希望它感谢现在的你什么？", [
    ["谢谢你当时勇敢开始", "action"], ["谢谢你没有再透支自己", "boundary"], ["谢谢你坚持做喜欢的事", "expression"], ["谢谢你允许生活有留白", "ease"]]],
  ["你心中理想的一天，更像哪幅画面？", [
    ["按计划完成重要的事，晚上安心休息", "order"], ["遇见意料之外的风景", "explore"], ["和在意的人有真诚连接", "relation"], ["慢慢吃饭、散步，不赶时间", "ease"]]],
  ["被否定时，你最想拥有哪种能力？", [
    ["稳定自己，不急着证明", "boundary"], ["把意见变成下一步行动", "action"], ["准确表达我的立场", "expression"], ["消化情绪，不把一句话留太久", "healing"]]],
  ["最近哪件小事最容易让你觉得“生活值得”？", [
    ["终于完成拖了很久的事", "action"], ["桌面干净、清单清晰", "order"], ["收到一句真诚的关心", "relation"], ["偶然发现一家喜欢的小店", "explore"]]],
  ["如果给生活加一个新习惯，你会选？", [
    ["每天写几句心情", "expression"], ["固定一个只属于自己的休息时段", "healing"], ["每周尝试一件没做过的小事", "explore"], ["睡前整理明天最重要的三件事", "order"]]],
  ["你更希望别人怎样记住你？", [
    ["温暖可靠，愿意认真陪伴", "relation"], ["有自己的声音和风格", "expression"], ["清醒坚定，知道什么适合自己", "boundary"], ["松弛有趣，和我相处很舒服", "ease"]]],
  ["计划突然被打乱时，你通常更需要？", [
    ["迅速重排优先级", "order"], ["允许自己先缓一缓", "healing"], ["把它当作一次意外支线", "explore"], ["找人聊聊，获得支持", "relation"]]],
  ["哪种“进步”最让你向往？", [
    ["从想很多变成做一点", "action"], ["从迎合别人变成尊重自己", "boundary"], ["从憋在心里变成清楚表达", "expression"], ["从事事用力变成张弛有度", "ease"]]],
  ["独处时，你最容易做什么？", [
    ["整理思路和接下来的安排", "order"], ["看书、听歌，让情绪慢慢落地", "healing"], ["记录灵感或做点创作", "expression"], ["随心决定，不给时间排太满", "ease"]]],
  ["面对一个想了很久的愿望，你此刻更愿意？", [
    ["拆成小步骤，今天就开始", "action"], ["先去体验相关的事，扩大想象", "explore"], ["和重要的人分享，邀请他们见证", "relation"], ["确认这是我的愿望，不是别人的期待", "boundary"]]],
  ["你理想中的忙碌是什么样？", [
    ["目标明确，每天都有实在推进", "action"], ["有节奏、有边界，不慌不乱", "order"], ["做能表达自己价值的事情", "expression"], ["忙里也有呼吸和开心的小空隙", "ease"]]],
  ["哪种变化会让你最有“转运感”？", [
    ["认识新的朋友和新的可能", "explore"], ["不再为不合适的人和事内耗", "boundary"], ["身体和情绪都慢慢有电", "healing"], ["身边的关系更真诚、更稳", "relation"]]],
  ["如果心里有一盏灯，你希望它照亮哪里？", [
    ["下一步真正可走的路", "action"], ["那些被忽略很久的感受", "healing"], ["我与别人之间的温柔连接", "relation"], ["从没看过的新地图", "explore"]]],
  ["当别人向你提出请求，你更想练习？", [
    ["先看自己的精力，再回答", "boundary"], ["把时间安排得更合理", "order"], ["真诚说出我能做到的部分", "expression"], ["不必完美帮到，也不因此自责", "ease"]]],
  ["你最近更想清理掉什么？", [
    ["反复拖延带来的停滞", "action"], ["堆积的物品与混乱安排", "order"], ["说不出口的委屈", "expression"], ["凡事都要做到最好的紧绷", "ease"]]],
  ["如果生活是一部电影，你希望接下来的镜头？", [
    ["主角坚定走向一个新目标", "action"], ["主角在陌生城市打开新地图", "explore"], ["主角与自己慢慢和解", "healing"], ["主角终于说出心里的话", "expression"]]],
  ["哪一种礼物最像你现在需要的？", [
    ["一本能帮我梳理生活的手账", "order"], ["一次没有任务的短暂假期", "ease"], ["一个愿意听我慢慢说的人", "relation"], ["一把替我关上消耗之门的钥匙", "boundary"]]],
  ["当你状态很好时，通常是因为？", [
    ["知道自己在为什么努力", "action"], ["生活节奏稳定、事情有序", "order"], ["和身边的人彼此理解", "relation"], ["有空间做真实的自己", "expression"]]],
  ["你更愿意把哪句话写在日历上？", [

  ["你想把自己的能量优先放在哪里？", [

const results = {
  action: { code: "01 · 启程篇", title: "把想法变成路", subtitle: "关键词：启动 · 推进 · 好事发生在行动里", tags: ["行动回暖", "目标落地", "机会靠近"], body: "接下来的半年，你的主线不是等待一个完美时机，而是让生活重新向前滚动。你会发现，很多困住你的并不是能力不够，而是第一步被想得太重。只要先做一个小动作，后面的路就会一点点显出来。你的“转运感”来自主动：发出那封邮件、开始那个计划、去见想见的人。", advice: "给目标设一个“小到不会失败”的起点。别要求每天都很燃，稳定前进一点点，就是你最扎实的好运。", quote: "你不用一下子看见终点，先让脚下有路。" },
  healing: { code: "02 · 回春篇", title: "身心慢慢回春", subtitle: "关键词：修复 · 充电 · 温柔地长回来", tags: ["能量回升", "自我照顾", "内心安稳"], body: "未来半年，你的人生剧本会从“照顾自己”开始转场。不是躺平，也不是逃避，而是终于把长期透支的部分慢慢补回来。睡得更踏实、情绪更有出口、对自己不再那么苛刻——这些看似普通的小事，会成为你重新有力量的根。等能量回来，你会自然知道下一步往哪里走。", advice: "把休息当作日程的一部分，而不是完成所有事后的奖励。每周留一段不需要证明价值的时间，给身体和心都松松绑。", quote: "花不是在催促里盛开，你也一样。" },
  order: { code: "03 · 安序篇", title: "把日子过成靠岸", subtitle: "关键词：整理 · 节奏 · 稳稳的掌控感", tags: ["生活归位", "节奏稳定", "安心积累"], body: "接下来的半年，你会在“把生活理顺”这件事上尝到甜头。不是把每一分钟塞满，而是清楚什么重要、什么可以晚一点。桌面、作息、财务、工作节奏会逐渐归位，心里的噪音也会跟着变小。你需要的好运，其实藏在那些重复却可靠的日常里。", advice: "一次只整理一个角落、一个习惯或一类待办。你的目标不是成为完美的大人，而是搭出一个能接住自己的生活系统。", quote: "日子被轻轻放好，心就有地方安顿。" },
  relation: { code: "04 · 相遇篇", title: "真心有了回声", subtitle: "关键词：连接 · 陪伴 · 双向奔赴", tags: ["关系升温", "被看见", "温柔互助"], body: "未来半年，你的主线会围绕“真实的连接”展开。你可能遇见聊得来的人，也可能和旧关系重新靠近。重点不是认识多少人，而是你越来越愿意把真实的自己放进关系里，同时也能听见对方。那些双向的关心、踏实的陪伴，会让你知道：很多路不必一个人硬撑。", advice: "把注意力留给会回应你的人。想念就联系，感谢就说出口；同时也允许关系有远近，不必对每个人都用尽全力。", quote: "好的关系不是消耗你，而是让你更像自己。" },
  explore: { code: "05 · 开图篇", title: "世界为你展开", subtitle: "关键词：探索 · 新鲜感 · 打开人生地图", tags: ["新体验", "视野打开", "灵感来访"], body: "接下来半年，你的人生会因为“去看看”而变得开阔。一次短途出发、一项新技能、一个不同圈层，都可能带来意外的启发。你不需要立刻找到唯一答案，这段时间的任务是收集线索、扩大体验。允许自己绕一点路，因为新的方向常常就藏在那些计划之外。", advice: "每个月安排一次低成本的新体验：换条回家路、学一节体验课、和不同领域的人聊聊天。好奇心会替你打开门。", quote: "当你走出熟悉的地图，风也会带来新消息。" },
  boundary: { code: "06 · 清醒篇", title: "为自己稳稳撑腰", subtitle: "关键词：边界 · 取舍 · 把选择权拿回来", tags: ["停止内耗", "清醒选择", "自我尊重"], body: "未来半年，你会越来越清楚：温柔不等于委屈自己，懂事也不必以透支为代价。你会学着分辨什么值得投入，什么该礼貌放下。每一次不勉强、不过度解释、尊重自己的感受，都是在把人生的方向盘拿回来。你的好运，是能量终于流向真正重要的人和事。", advice: "答应之前停三秒，先问自己“我愿意吗、我有余力吗”。边界不需要很锋利，清楚、稳定、前后一致就足够。", quote: "拒绝不合适的，才有位置迎接真正想要的。" },
  expression: { code: "07 · 发光篇", title: "你的声音被听见", subtitle: "关键词：表达 · 创造 · 真实地被看见", tags: ["灵感生长", "自信表达", "个人风格"], body: "接下来的半年，你的主线是“让内在的东西拥有形状”。也许是写作、分享、创作，也许只是更坦然地说出想法和感受。当你不再把所有声音都压回心里，别人才能真正认识你，机会也更容易找到你。你无需模仿谁，你的经验和视角本身就很有价值。", advice: "先稳定输出，再追求漂亮。每周留下一份小作品，或认真表达一次真实想法。被看见的第一步，是允许自己出现。", quote: "你不必更响亮，只要更诚实。" },
  ease: { code: "08 · 松风篇", title: "轻盈不是偷懒", subtitle: "关键词：松弛 · 留白 · 好事自然靠近", tags: ["卸下紧绷", "生活有光", "自在呼吸"], body: "未来半年，你会慢慢退出“什么都要做好”的紧绷剧本。不是失去上进心，而是更懂得把力气用在值得的地方。你会允许计划有弹性、情绪有阴天、生活偶尔没有答案。奇妙的是，当你不再时时用力证明自己，快乐、灵感和好机会反而更容易靠近。", advice: "每天删掉一件并不重要的事，也给日程留一点空白。真正可持续的努力，应该容得下散步、发呆和临时起意。", quote: "风不赶路，却总能抵达想去的地方。" }
};

let current = 0;
let answers = Array(questions.length).fill(null);

const $ = id => document.getElementById(id);
const screens = [$("cover"), $("quiz"), $("result")];
function show(id) {
  screens.forEach(s => s.classList.toggle("active", s.id === id));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderQuestion() {
  const [text, opts] = questions[current];
  $("questionNo").textContent = `QUESTION ${String(current + 1).padStart(2, "0")}`;
  $("questionText").textContent = text;
  $("progressText").textContent = `${current + 1} / ${questions.length}`;
  $("progressBar").style.width = `${((current + 1) / questions.length) * 100}%`;
  $("backBtn").style.visibility = current === 0 ? "hidden" : "visible";
  $("nextBtn").innerHTML = current === questions.length - 1 ? "查看我的人生主线 <span>→</span>" : "下一题 <span>→</span>";
  $("nextBtn").disabled = answers[current] === null;
  const box = $("options"); box.innerHTML = "";
  opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = `option${answers[current] === i ? " selected" : ""}`;
    btn.setAttribute("role", "radio"); btn.setAttribute("aria-checked", answers[current] === i ? "true" : "false");
    btn.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${opt[0]}</span>`;
    btn.addEventListener("click", () => { answers[current] = i; renderQuestion(); });
    box.appendChild(btn);
  });
}

function calculate() {
  const scores = Object.fromEntries(dimensions.map(d => [d, 0]));
  answers.forEach((answer, i) => { if (answer !== null) scores[questions[i][1][answer][1]] += 1; });
  const max = Math.max(...Object.values(scores));
  const tied = dimensions.filter(d => scores[d] === max);
  // 平分时使用答案序列生成稳定索引，避免总偏向同一类型。
  const seed = answers.reduce((sum, value, i) => sum + (value + 1) * (i + 3), 0);
  return tied[seed % tied.length];
}

function renderResult() {
  const key = calculate(); const r = results[key];
  $("resultCode").textContent = r.code;
  $("resultTitle").textContent = r.title;
  $("resultBody").textContent = r.body;
  $("resultAdvice").textContent = r.advice;
  $("resultQuote").textContent = `“${r.quote}”`;
  const colors = { action: "#ddc4aa", healing: "#c9d7ca", order: "#b9c6bd", relation: "#ddc0bd", explore: "#c7cfda", boundary: "#c9c4d0", expression: "#dfc7b4", ease: "#d7d5bd" };
  $("resultIcon").style.background = colors[key];
  show("result");
}

$("startBtn").addEventListener("click", () => { current = 0; renderQuestion(); show("quiz"); });
$("backBtn").addEventListener("click", () => { if (current > 0) { current -= 1; renderQuestion(); } });
$("nextBtn").addEventListener("click", () => { if (answers[current] === null) return; if (current < questions.length - 1) { current += 1; renderQuestion(); window.scrollTo({top: 0, behavior: "smooth"}); } else renderResult(); });
$("restartBtn").addEventListener("click", () => { answers = Array(questions.length).fill(null); current = 0; show("cover"); });

</script>
